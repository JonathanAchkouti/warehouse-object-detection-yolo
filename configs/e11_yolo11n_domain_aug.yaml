data:
  raw_dir: dataset
  yolo_workspace: /content/loco-yolo
  copy_images: true

model:
  weights: yolo11n.pt
  input_size: 640
  score_thresh: 0.001
  nms_thresh: 0.70
  detections_per_img: 300

train:
  epochs: 100
  batch_size: 16
  num_workers: 2
  seed: 0
  patience: 20
  resume: true
  amp: true
  deterministic: true
  optimizer: auto
  cos_lr: true
  close_mosaic: 10
  horizontal_flip: 0.50
  hsv_h: 0.03
  hsv_s: 0.40
  hsv_v: 0.40
  degrees: 3.0
  translate: 0.10
  scale: 0.40
  shear: 1.0
  perspective: 0.0005
  mosaic: 0.50
  mixup: 0.05
  multi_scale: 0.25
  domain_augmentations:
    grayscale_probability: 0.20
    blur_probability: 0.18
    sharpen_probability: 0.12
    gamma_probability: 0.20
    brightness_contrast_probability: 0.30

output_dir: runs/e11_yolo11n_domain_aug
